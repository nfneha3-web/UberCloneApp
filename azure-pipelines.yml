trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  azureSubscription: 'ServiceCon1'
  appServiceName: 'rideshare-api'
  apiProjectPath: 'backend/src/Presentation/RideShare.Api/RideShare.Api.csproj'
  solutionPath: 'backend/RideShare.sln'

stages:
  - stage: Build
    displayName: 'Build, test, publish'
    jobs:
      - job: Build
        displayName: 'Build and test'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 9 SDK'
            inputs:
              packageType: 'sdk'
              version: '9.x'

          - script: dotnet restore $(solutionPath)
            displayName: 'Restore'

          - script: dotnet build $(solutionPath) --configuration $(buildConfiguration) --no-restore
            displayName: 'Build'

          - script: dotnet test backend/tests/RideShare.Domain.Tests/RideShare.Domain.Tests.csproj --configuration $(buildConfiguration) --no-build
            displayName: 'Run Domain tests'

          - script: dotnet test backend/tests/RideShare.Application.Tests/RideShare.Application.Tests.csproj --configuration $(buildConfiguration) --no-build
            displayName: 'Run Application tests'

          - script: dotnet publish $(apiProjectPath) --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish
            displayName: 'Publish API'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
              ArtifactName: 'api-drop'

  # No separate migrate stage: migrations were applied once, manually, via the Azure Portal
  # Query Editor (generated by `dotnet ef migrations script`). Future schema changes get a new
  # migration + a new generated script run the same way — see docs/ROADMAP.md.

  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: Build
    jobs:
      - deployment: Deploy
        displayName: 'Deploy API'
        environment: 'production'
        pool:
          vmImage: 'windows-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webApp'
                    appName: '$(appServiceName)'
                    package: '$(Pipeline.Workspace)/api-drop'

  - stage: DeployFrontend
    displayName: 'Build and deploy Angular frontend'
    jobs:
      - job: BuildFrontend
        displayName: 'Build and deploy to Static Web App'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            workingDirectory: frontend/rideshare-web
            displayName: 'npm ci'

          - script: npm run build -- --configuration production
            workingDirectory: frontend/rideshare-web
            displayName: 'Build Angular (production)'

          - task: AzureStaticWebApp@0
            inputs:
              app_location: 'frontend/rideshare-web/dist/rideshare-web/browser'
              skip_app_build: true
              azure_static_web_apps_api_token: '$(SwaDeploymentToken)'
